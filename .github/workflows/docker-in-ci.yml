name: docker

on:
  push:
    branches:
      - 'main'
      - 'release/**'
  pull_request:
    branches:
      - 'main'
      - 'release/**'

jobs:
  docker-basic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build docker basic image
        run: |
          docker build -t abcd-graph .

      - name: Inspect basic docker image
        run: |
          docker image inspect abcd-graph

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'abcd-graph'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          version: 'v0.74.0'

      - name: Run basic docker image
        run: |
          docker run --rm abcd-graph -c "from abcd_graph import ABCD, ABCDSample"

  docker-full:
    needs:
      - docker-basic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build docker full image
        run: |
          docker build -t abcd-graph-full --build-arg INSTALL_TYPE=all .

      - name: Inspect full docker image
        run: |
          docker image inspect abcd-graph-full

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'abcd-graph-full'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          version: 'v0.74.0'

      - name: Run full docker image
        run: |
          docker run --rm abcd-graph-full -c "from abcd_graph import ABCD, ABCDSample; import igraph; import networkx"
